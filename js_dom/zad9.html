<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zad9</title>
</head>
<body>
    <p id="odl">Odlomak</p>
    <button id="btn">Sakriji/Prikazi</button>

    <script>
        let odlomak = document.getElementById("odl");
        let gumb = document.getElementById("btn");

        gumb.onclick = function(){
        if(odlomak.style.display === "none"){
            odlomak.style.display = "block";
        }
        else odlomak.style.display = "none";
        }
    </script>
</body>
</html>
