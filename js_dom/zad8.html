<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zad8</title>
    <style>
        .istaknuto{
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <div class="istaknuto" id="dado">test</div>
    <button id="btn">Toggle</button>
    
    <script>
        let div1 = document.getElementById("dado");
        let btn = document.getElementById("btn");
        
        btn.onclick = function(){
            div1.classList.toggle("istaknuto");
        }
    </script>
</body>
</html>
